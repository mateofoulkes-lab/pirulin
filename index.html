<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Pirulín!</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    html,body{margin:0;height:100%;background:#fff}
    body{display:grid;place-items:center;font-family:system-ui,sans-serif;color:#6e737d}
    .loading{font-weight:700;font-size:14px}
  </style>
</head>
<body>
  <div class="loading">Pirulín! ✨</div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(console.error);
    }

    (async () => {
      try {
        const response = await fetch('./mockup_pirulin_v51.html', { cache: 'no-cache' });
        if (!response.ok) throw new Error('No se pudo cargar mockup_pirulin_v51.html');

        let html = await response.text();
        const appHead = `
          <link rel="manifest" href="./manifest.webmanifest">
          <meta name="theme-color" content="#ffffff">
          <meta name="mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="default">
        `;
        const appScripts = `<script type="module" src="./firebase-client.js"><\/script>`;
        html = html.replace('</head>', appHead + '</head>');
        html = html.replace('</body>', appScripts + '</body>');

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error(error);
        document.body.innerHTML = '<div class="loading">No pude cargar Pirulín. Recargá la página.</div>';
      }
    })();
  </script>
</body>
</html>
